name: Alternative Ruby Engines

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: "jruby-10.1.2.0"
            name: "JRuby 10.1.2.0"
          - ruby-version: "truffleruby-40.0.0"
            name: "TruffleRuby 40.0.0"

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v5
        with:
          # ruby-build checks the `java` on PATH, which mise does not provide
          # while installing JRuby: install Java alone first.
          install_args: ${{ startsWith(matrix.ruby-version, 'jruby') && 'java' || '' }}
          mise_toml: |
            [tools]
            ruby = "${{ matrix.ruby-version }}"
            ${{ startsWith(matrix.ruby-version, 'jruby') && 'java = "temurin-21"' || '' }}

      - name: Install JRuby on mise's Java
        if: startsWith(matrix.ruby-version, 'jruby')
        run: mise exec java -- mise install ruby

      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ matrix.ruby-version }}-${{ hashFiles('Gemfile', '*.gemspec') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Run tests
        run: bundle exec ruby -Ilib:test test/*_test.rb
