[package]
name = "breaker-machines"
version = "0.24.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license.workspace = true
description = "Allocation-free circuit breaker decisions, with a std runtime for guarding closures and futures"
repository = "https://github.com/seuros/breaker_machines"
readme = "README.md"
keywords = ["circuit-breaker", "reliability", "fault-tolerance", "no-std"]
categories = ["no-std", "concurrency", "algorithms"]
exclude = ["src/**/tests.rs", "src/tests/", "src/test_support.rs", "tests/"]

[features]
default = []
# The runtime layer: closure-guarding `CircuitBreaker`, clocks, callbacks,
# failure classifiers. Needs `std` (and with it an allocator); the decision
# core never does.
std = ["dep:state-machines"]
# `AsyncCircuitBreaker`, `DistributedCircuitBreaker` and the async storage
# contract, on top of `std`.
async = ["std"]

[lints]
workspace = true

[dependencies]
chrono-machines = { version = ">=0.12", default-features = false }
periscope-machines = ">=0.5"
# The runtime's lifecycle machine, driven by the core's answers.
state-machines = { version = ">=0.34", default-features = false, optional = true }

[dev-dependencies]
matryona-machines = { workspace = true, features = ["testing"] }
pollster = "0.4"
