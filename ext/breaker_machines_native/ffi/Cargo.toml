[package]
name = "breaker_machines_native"
version = "0.5.23"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Ruby FFI bindings for breaker-machines circuit breaker"
repository = "https://github.com/seuros/breaker_machines"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
breaker-machines = { path = "../core", version = "0.23.0" }
magnus = { version = ">= 0.9.3", default-features = false, features = ["io"] }
# Nothing here calls rb-sys directly: this is the compiled fallback that
# implements the stable API for a Ruby rb-sys ships no pre-generated bindings
# for, such as a preview. magnus asks for "stable-api" without it, and its
# default-features = false drops the default that would have supplied it, so
# dropping this line breaks the build on every Ruby newer than rb-sys.
rb-sys = { version = ">= 0.9.130", default-features = false, features = ["stable-api-compiled-fallback"] }

