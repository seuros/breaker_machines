[workspace]
members = ["ext/breaker_machines_native/core", "ext/breaker_machines_native/ffi"]
default-members = ["ext/breaker_machines_native/core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
breaker-machines = { path = "ext/breaker_machines_native/core" }
matryona-machines = { version = ">=0.6", default-features = false }
magnus = { version = "0.9.3", default-features = false }
# Nothing here calls rb-sys directly: this is the compiled fallback that
# implements the stable API for a Ruby rb-sys ships no pre-generated bindings
# for, such as a preview. magnus asks for "stable-api" without it, and its
# default-features = false drops the default that would have supplied it.
rb-sys = { version = "0.9.130", default-features = false, features = ["stable-api-compiled-fallback"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"
